<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <title>活動時刻表</title>
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#818cf8" />
            <stop offset="1" stop-color="#4338ca" />
        </linearGradient>
        <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fde68a" />
            <stop offset="0.55" stop-color="#fbbf24" />
            <stop offset="1" stop-color="#f59e0b" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.35" />
        </filter>
    </defs>

    <!-- Full-bleed background so the icon also works as a maskable icon -->
    <rect width="512" height="512" fill="url(#bg)" />

    <!-- Calendar -->
    <g filter="url(#shadow)">
        <rect x="128" y="140" width="232" height="220" rx="30" fill="#ffffff" />
        <path d="M158 140h172a30 30 0 0 1 30 30v26H128v-26a30 30 0 0 1 30-30z" fill="#4f46e5" />
    </g>
    <rect x="178" y="116" width="22" height="50" rx="11" fill="#e0e7ff" />
    <rect x="288" y="116" width="22" height="50" rx="11" fill="#e0e7ff" />

    <!-- Day grid -->
    <g fill="#c7d2fe">
        <rect x="154" y="216" width="44" height="34" rx="9" />
        <rect x="222" y="216" width="44" height="34" rx="9" />
        <rect x="290" y="216" width="44" height="34" rx="9" />
        <rect x="154" y="266" width="44" height="34" rx="9" />
        <rect x="154" y="316" width="44" height="34" rx="9" />
    </g>
    <rect x="222" y="266" width="44" height="34" rx="9" fill="#6366f1" />

    <!-- Gold coin with clock -->
    <g filter="url(#shadow)">
        <circle cx="338" cy="338" r="82" fill="#ffffff" />
        <circle cx="338" cy="338" r="72" fill="url(#coin)" />
    </g>
    <circle cx="338" cy="338" r="56" fill="none" stroke="#d97706" stroke-width="6" />
    <g stroke="#92400e" stroke-width="12" stroke-linecap="round">
        <line x1="338" y1="338" x2="338" y2="302" />
        <line x1="338" y1="338" x2="364" y2="352" />
    </g>
    <circle cx="338" cy="338" r="9" fill="#92400e" />
</svg>
