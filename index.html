<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>活動時刻表</title>

    <meta name="description" content="活動時間表與工具連結" />
    <meta name="theme-color" content="#2b1650" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="活動時刻表" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />

    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
</head>

<body>
    <button id="mobileMenuBtn" class="mobile-menu-btn" type="button" data-i18n="toolButton">
        ☰ 工具
    </button>

    <aside id="mobileSidebar" class="mobile-sidebar">
        <div class="mobile-sidebar-header">
            <strong data-i18n="toolLinksTitle">工具連結</strong>
            <button id="mobileSidebarClose" class="mobile-sidebar-close" type="button">×</button>
        </div>

        <nav class="mobile-tool-nav">
            <div class="sidebar-section-title" data-i18n="externalTools">外部工具</div>

            <a href="https://der46.github.io/farm-hatch-calculator/" target="_blank" rel="noopener noreferrer">
                <span class="tool-link-icon">🌹</span>
                <span data-i18n="toolFarm">耕種計算機</span>
            </a>

            <a href="https://der46.github.io/boss-battle-calculator/" target="_blank" rel="noopener noreferrer">
                <span class="tool-link-icon">👾</span>
                <span data-i18n="toolBoss">首領戰計算機</span>
            </a>

            <a href="https://der46.github.io/cm-merge/" target="_blank" rel="noopener noreferrer">
                <span class="tool-link-icon">🏝️</span>
                <span data-i18n="toolMerge">合併島嶼矩陣計算器</span>
            </a>

            <a href="https://der46.github.io/snow-calc/" target="_blank" rel="noopener noreferrer">
                <span class="tool-link-icon">❄️</span>
                <span data-i18n="toolSnow">雪崩派對進度計算機</span>
            </a>

            <a href="https://der46.github.io/energy-group-helper/" target="_blank" rel="noopener noreferrer">
                <span class="tool-link-icon">🔄</span>
                <span data-i18n="toolEnergyGroup">活動道具換算</span>
            </a>

            <a href="https://der46.github.io/coin_fetch/" target="_blank" rel="noopener noreferrer">
                <span class="tool-link-icon">🔋</span>
                <span data-i18n="toolReward">CM每日獎勵連結</span>
            </a>

            <a href="https://der46.github.io/cm_village_cost/" target="_blank" rel="noopener noreferrer">
                <span class="tool-link-icon">💰</span>
                <span data-i18n="toolVillageCost">建村金額</span>
            </a>
        </nav>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <main class="app">
        <section class="hero">
            <div class="hero-actions">
                <select id="languageSelect" class="language-select" aria-label="Language">
                    <option value="zh-Hant">中文</option>
                    <option value="en">English</option>
                    <option value="vi">Tiếng Việt</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="th">ไทย</option>
                    <option value="id">Bahasa Indonesia</option>
                    <option value="es">Español</option>
                    <option value="pt-BR">Português</option>
                </select>

                <button id="installAppBtn" class="install-app-btn" type="button" data-i18n="installApp">
                    ⬇️ 安裝APP
                </button>

                <button id="desktopToolBtn" class="top-tool-btn" type="button" data-i18n="toolLinksButton">
                    ☰ 工具連結
                </button>
            </div>

            <div class="hero-title">
                <h1 data-i18n="appTitle">活動時刻表</h1>
                <p class="hero-credit">
                    <span class="hero-credit-coin" aria-hidden="true">C</span>
                    大佬群CSL製作
                </p>
            </div>
        </section>

        <section id="nowCard" class="now-card" aria-live="polite"></section>

        <section class="weekday-card">
            <div class="weekday-header">
                <div>
                    <h2 class="weekday-title" data-i18n="selectWeekday">選擇星期</h2>
                    <div id="weekdaySubtitle" class="weekday-subtitle" data-i18n="defaultToday">
                        預設顯示今天的活動
                    </div>
                </div>
            </div>

            <div id="weekdayButtons" class="weekday-buttons">
                <button class="weekday-btn" type="button" data-command="/1">
                    <span class="weekday-main" data-i18n="monShort">週一</span>
                    <span class="weekday-small" data-i18n="mon">星期一</span>
                </button>

                <button class="weekday-btn" type="button" data-command="/2">
                    <span class="weekday-main" data-i18n="tueShort">週二</span>
                    <span class="weekday-small" data-i18n="tue">星期二</span>
                </button>

                <button class="weekday-btn" type="button" data-command="/3">
                    <span class="weekday-main" data-i18n="wedShort">週三</span>
                    <span class="weekday-small" data-i18n="wed">星期三</span>
                </button>

                <button class="weekday-btn" type="button" data-command="/4">
                    <span class="weekday-main" data-i18n="thuShort">週四</span>
                    <span class="weekday-small" data-i18n="thu">星期四</span>
                </button>

                <button class="weekday-btn" type="button" data-command="/5">
                    <span class="weekday-main" data-i18n="friShort">週五</span>
                    <span class="weekday-small" data-i18n="fri">星期五</span>
                </button>

                <button class="weekday-btn" type="button" data-command="/6">
                    <span class="weekday-main" data-i18n="satShort">週六</span>
                    <span class="weekday-small" data-i18n="sat">星期六</span>
                </button>

                <button class="weekday-btn" type="button" data-command="/7">
                    <span class="weekday-main" data-i18n="sunShort">週日</span>
                    <span class="weekday-small" data-i18n="sun">星期日</span>
                </button>
            </div>
        </section>

        <section id="dailyScheduleSection" class="detail-section">
            <div class="panel detail-panel">
                <div class="panel-title">
                    <h2 data-i18n="dailySchedule">每天時間表</h2>
                </div>

                <div id="detailEmpty" class="detail-empty" data-i18n="loadingPleaseWait">
                    資料載入中，請稍候。
                </div>

                <div id="detailBox" class="detail-box">
                    <div class="detail-top">
                        <div id="detailCommand" class="detail-command"></div>
                        <div id="todayBadge" class="today-badge"></div>
                    </div>

                    <h3 id="detailTitle"></h3>

                    <div id="scheduleView"></div>

                    <button id="rawToggleBtn" class="raw-description-toggle" type="button" data-i18n="showRaw">
                        顯示原始文字內容
                    </button>

                    <div id="detailDescription" class="raw-description"></div>
                </div>
            </div>
        </section>

        <footer class="site-footer">
            <p data-i18n="disclaimer">活動時間僅供參考，實際內容請以遊戲內顯示為準。</p>
            <p>資料提供 CM大佬群 隊伍網頁製作 Coin999-長長久久隊伍</p>
            <p class="footer-credit">大佬群CSL製作</p>
        </footer>
    </main>

    <dialog id="calDialog" class="cal-dialog" aria-labelledby="calDialogTitle"></dialog>

    <div id="toast" class="toast"></div>
</body>

</html>
