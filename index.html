<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>活動時刻表</title>

    <style>
        :root {
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --border: #d8d8d8;
            --soft-border: #e5e7eb;
            --danger: #ff1d1d;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            --radius: 18px;
            --table-yellow: #fff6b8;
            --table-head: #fffdf1;
            --time-width: 115px;
            --duration-width: 150px;
            --event-min-height: 40px;
            --schedule-board-width: 960px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                "Microsoft JhengHei",
                Arial,
                sans-serif;
            background:
                radial-gradient(circle at top left, #eef2ff 0, transparent 32%),
                radial-gradient(circle at bottom right, #fdf2f8 0, transparent 30%),
                var(--bg);
        }

        body.sidebar-open {
            overflow: hidden;
        }

        button,
        select {
            font-family: inherit;
        }

        .app {
            max-width: 1080px;
            margin: 0 auto;
        }

        .hero {
            position: relative;
            margin: 32px 0 24px;
            text-align: center;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 44px);
            letter-spacing: 0.04em;
        }

        .hero-actions {
            position: absolute;
            top: 4px;
            right: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .language-select {
            min-width: 118px;
            padding: 10px 12px;
            color: #374151;
            font-size: 14px;
            font-weight: 900;
            background: #fff;
            border: 1px solid var(--soft-border);
            border-radius: 999px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
            outline: none;
            cursor: pointer;
        }

        .language-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .top-tool-btn {
            padding: 10px 16px;
            color: #fff;
            font-size: 15px;
            font-weight: 950;
            background: var(--primary);
            border: none;
            border-radius: 999px;
            box-shadow: 0 12px 28px rgba(79, 70, 229, 0.22);
            cursor: pointer;
            transition: 0.18s ease;
        }

        .top-tool-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .weekday-card,
        .panel {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        .weekday-card {
            margin-bottom: 22px;
            padding: 18px;
        }

        .weekday-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .weekday-title {
            margin: 0;
            font-size: 20px;
            font-weight: 950;
        }

        .weekday-subtitle {
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
        }

        .weekday-buttons {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 10px;
        }

        .weekday-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 72px;
            padding: 10px 8px;
            color: #374151;
            font-weight: 950;
            background: #fff;
            border: 1px solid var(--soft-border);
            border-radius: 16px;
            cursor: pointer;
            transition: 0.18s ease;
        }

        .weekday-btn:hover {
            color: var(--primary-dark);
            background: #eef2ff;
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .weekday-btn.active {
            color: #fff;
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 10px 22px rgba(99, 102, 241, 0.2);
        }

        .weekday-btn.today {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .weekday-btn.active.today {
            box-shadow: 0 10px 22px rgba(99, 102, 241, 0.25);
        }

        .weekday-main {
            font-size: 18px;
            line-height: 1;
        }

        .weekday-small {
            font-size: 12px;
            opacity: 0.82;
        }

        .detail-section {
            margin-top: 22px;
            margin-bottom: 22px;
        }

        .panel {
            min-height: 240px;
            padding: 20px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .panel-title h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 950;
        }

        .detail-empty {
            padding: 38px 12px;
            color: var(--muted);
            font-weight: 800;
            line-height: 1.8;
            text-align: center;
        }

        .detail-box {
            display: none;
        }

        .detail-box.show {
            display: block;
        }

        .detail-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .detail-command {
            padding: 8px 12px;
            color: var(--primary-dark);
            font-weight: 950;
            background: #eef2ff;
            border-radius: 999px;
        }

        .today-badge {
            padding: 8px 12px;
            color: #0e7490;
            font-size: 14px;
            font-weight: 950;
            background: #ecfeff;
            border-radius: 999px;
        }

        .detail-box h3 {
            margin: 0 0 12px;
            font-size: 26px;
            line-height: 1.35;
        }

        .schedule-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 16px 0;
        }

        .summary-card {
            padding: 12px;
            background: #f9fafb;
            border: 1px solid var(--soft-border);
            border-radius: 14px;
        }

        .summary-label {
            margin-bottom: 4px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 900;
        }

        .summary-value {
            color: #111827;
            font-size: 22px;
            font-weight: 950;
        }

        .schedule-shell {
            margin-top: 16px;
            overflow: hidden;
            background: var(--table-yellow);
            border: 1px solid #cfcfcf;
            border-radius: 18px;
        }

        .schedule-fit {
            width: 100%;
            overflow: visible;
        }

        .schedule-board {
            width: var(--schedule-board-width);
            min-height: 560px;
            margin: 0 auto;
            background: #fff;
            border-right: 1px solid var(--border);
            border-left: 1px solid var(--border);
            transform-origin: top left;
        }

        .schedule-board-head,
        .schedule-hour-row {
            display: grid;
            grid-template-columns: var(--time-width) 1fr var(--duration-width);
        }

        .schedule-board-head {
            min-height: 58px;
            background: var(--table-head);
            border-bottom: 1px solid var(--border);
        }

        .schedule-head-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 12px;
            font-weight: 950;
            line-height: 1.35;
            text-align: center;
            border-right: 1px solid var(--border);
        }

        .schedule-head-cell:last-child {
            border-right: none;
        }

        .schedule-update {
            margin-top: 2px;
            color: #6b7280;
            font-size: 13px;
            font-weight: 800;
        }

        .schedule-hour-row {
            position: relative;
            min-height: 30px;
            background: #fff;
            border-bottom: 1px solid var(--border);
        }

        .schedule-hour-row.current-hour::after {
            content: "";
            position: absolute;
            z-index: 5;
            inset: -1px 0 -1px 0;
            border: 3px solid var(--danger);
            pointer-events: none;
        }

        .hour-time-cell {
            padding: 4px 8px;
            color: #0f172a;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.25;
            border-right: 1px solid var(--border);
        }

        .hour-events-cell {
            border-right: 1px solid var(--border);
        }

        .event-cell-row,
        .duration-cell-row {
            min-height: var(--event-min-height);
            border-bottom: 1px solid #eeeeee;
        }

        .event-cell-row:last-child,
        .duration-cell-row:last-child {
            border-bottom: none;
        }

        .event-cell-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            padding: 6px 10px;
        }

        .duration-cell-row {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            padding: 6px 8px;
            color: #0f172a;
            font-weight: 950;
            line-height: 1.35;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
            text-align: center;
        }

        .empty-event-row,
        .empty-duration-row {
            min-height: 30px;
        }

        .event-start {
            padding: 3px 8px;
            color: #4f46e5;
            font-size: 13px;
            font-weight: 950;
            white-space: nowrap;
            background: #eef2ff;
            border-radius: 999px;
        }

        .event-badge {
            padding: 5px 9px;
            color: #fff;
            font-size: 12px;
            font-weight: 950;
            white-space: nowrap;
            border-radius: 999px;
        }

        .event-badge.village {
            background: #16a34a;
        }

        .event-badge.coin {
            background: #f59e0b;
        }

        .event-badge.hammer {
            background: #2563eb;
        }

        .event-badge.card {
            background: #7c3aed;
        }

        .event-badge.mission {
            background: #db2777;
        }

        .event-badge.default {
            background: #64748b;
        }

        .event-title-wrap {
            min-width: 0;
        }

        .event-name {
            color: #111827;
            font-weight: 950;
            line-height: 1.35;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .event-note {
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            line-height: 1.4;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .raw-description-toggle {
            margin-top: 18px;
            padding: 9px 13px;
            color: #374151;
            font-weight: 900;
            background: #fff;
            border: 1px solid var(--soft-border);
            border-radius: 999px;
            cursor: pointer;
            transition: 0.18s ease;
        }

        .raw-description-toggle:hover {
            color: var(--primary-dark);
            background: #eef2ff;
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .raw-description {
            display: none;
            margin-top: 14px;
            padding: 14px;
            color: #374151;
            line-height: 1.9;
            background: #f9fafb;
            border: 1px dashed var(--soft-border);
            border-radius: 14px;
        }

        .raw-description.show {
            display: block;
            margin: 14px 0 18px;
            padding: 16px;
            color: #111827;
            font-weight: 800;
            line-height: 1.9;
            background: #f8fafc;
            border: 1px solid var(--soft-border);
            border-radius: 16px;
        }

        .raw-description a {
            color: var(--primary-dark);
            font-weight: 950;
            word-break: break-all;
        }

        .no-result,
        .loading-box,
        .error-box {
            padding: 28px;
            color: var(--muted);
            font-weight: 800;
            line-height: 1.8;
            text-align: center;
            background: #fafafa;
            border: 1px dashed var(--soft-border);
            border-radius: 15px;
        }

        .error-box {
            color: #991b1b;
            background: #fff1f2;
            border-color: #fca5a5;
        }

        .site-footer {
            margin: 28px 0 12px;
            padding: 18px 12px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
            line-height: 1.6;
            text-align: center;
        }

        .mobile-menu-btn {
            position: fixed;
            right: 14px;
            bottom: 14px;
            z-index: 9000;
            display: none;
            padding: 12px 16px;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 950;
            background: var(--primary);
            border: none;
            border-radius: 999px;
            box-shadow: 0 12px 28px rgba(79, 70, 229, 0.28);
            cursor: pointer;
        }

        .mobile-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 10000;
            width: min(84vw, 360px);
            height: 100vh;
            padding: 18px;
            overflow-y: auto;
            background: #fff;
            box-shadow: -18px 0 40px rgba(15, 23, 42, 0.18);
            transform: translateX(105%);
            transition: transform 0.22s ease;
        }

        .mobile-sidebar.show {
            transform: translateX(0);
        }

        .mobile-sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 20px;
            font-weight: 950;
        }

        .mobile-sidebar-close {
            width: 38px;
            height: 38px;
            color: #111827;
            font-family: inherit;
            font-size: 26px;
            font-weight: 950;
            background: #f3f4f6;
            border: none;
            border-radius: 999px;
            cursor: pointer;
        }

        .mobile-tool-nav {
            display: grid;
            gap: 10px;
        }

        .mobile-tool-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 13px 14px;
            color: #111827;
            font-size: 15px;
            font-weight: 900;
            line-height: 1.45;
            text-align: left;
            text-decoration: none;
            background: #f8fafc;
            border: 1px solid var(--soft-border);
            border-radius: 14px;
            cursor: pointer;
            transition: 0.18s ease;
        }

        .mobile-tool-nav a:hover {
            color: var(--primary-dark);
            background: #eef2ff;
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .tool-link-icon {
            display: inline-flex;
            flex: 0 0 34px;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            font-size: 20px;
            background: #eef2ff;
            border-radius: 10px;
        }

        .sidebar-section-title {
            margin: 12px 2px 2px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 950;
        }

        .sidebar-overlay {
            position: fixed;
            z-index: 9998;
            inset: 0;
            display: none;
            background: rgba(15, 23, 42, 0.42);
        }

        .sidebar-overlay.show {
            display: block;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            z-index: 10001;
            padding: 12px 18px;
            color: #fff;
            font-weight: 800;
            background: #111827;
            border-radius: 999px;
            box-shadow: var(--shadow);
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(20px);
            transition: 0.25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 820px) {
            body {
                padding: 12px;
            }

            .hero {
                margin: 22px 0 18px;
                padding-top: 4px;
            }

            .hero-actions {
                position: static;
                justify-content: center;
                margin-bottom: 14px;
            }

            .top-tool-btn {
                display: none;
            }

            .weekday-card,
            .panel {
                border-radius: 16px;
            }

            .weekday-card {
                padding: 14px 10px;
            }

            .weekday-header {
                flex-direction: column;
                margin-bottom: 12px;
            }

            .weekday-buttons {
                grid-template-columns: repeat(7, minmax(0, 1fr));
                gap: 4px;
            }

            .weekday-btn {
                min-height: 54px;
                padding: 8px 2px;
                border-radius: 10px;
            }

            .weekday-main {
                font-size: 13px;
            }

            .weekday-small {
                font-size: 10px;
                line-height: 1.1;
            }

            .panel {
                padding: 16px;
            }

            .detail-box h3 {
                font-size: 22px;
            }

            .schedule-summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .summary-value {
                font-size: 20px;
            }

            .mobile-menu-btn {
                display: block;
            }

            .toast {
                width: calc(100% - 32px);
                text-align: center;
                border-radius: 16px;
            }
        }

        @media (max-width: 520px) {
            :root {
                --schedule-board-width: 900px;
            }

            .weekday-card {
                padding: 12px 8px;
            }

            .weekday-buttons {
                grid-template-columns: repeat(7, minmax(0, 1fr));
                gap: 3px;
            }

            .weekday-btn {
                min-height: 50px;
                padding: 7px 1px;
                border-radius: 9px;
            }

            .weekday-main {
                font-size: 12px;
            }

            .weekday-small {
                display: none;
            }

            .schedule-summary {
                gap: 8px;
            }

            .summary-card {
                padding: 10px;
            }

            .summary-label {
                font-size: 12px;
            }

            .summary-value {
                font-size: 18px;
            }
        }

        @media (max-width: 390px) {
            .weekday-card {
                padding: 10px 6px;
            }

            .weekday-buttons {
                gap: 2px;
            }

            .weekday-btn {
                min-height: 46px;
                padding: 6px 0;
                border-radius: 8px;
            }

            .weekday-main {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <button id="mobileMenuBtn" class="mobile-menu-btn" type="button" data-i18n="toolButton">
        ☰ 工具
    </button>

    <aside id="mobileSidebar" class="mobile-sidebar">
        <div class="mobile-sidebar-header">
            <strong data-i18n="toolLinksTitle">工具連結</strong>
            <button id="mobileSidebarClose" class="mobile-sidebar-close" type="button">×</button>
        </div>

        <nav class="mobile-tool-nav">
            <div class="sidebar-section-title" data-i18n="externalTools">外部工具</div>

            <a href="https://der46.github.io/farm-hatch-calculator/" target="_blank" rel="noopener noreferrer">
                <span class="tool-link-icon">🌹</span>
                <span data-i18n="toolFarm">耕種計算機</span>
            </a>

            <a href="https://der46.github.io/boss-battle-calculator/" target="_blank" rel="noopener noreferrer">
                <span class="tool-link-icon">👾</span>
                <span data-i18n="toolBoss">首領戰計算機</span>
            </a>

            <a href="https://der46.github.io/cm-merge/" target="_blank" rel="noopener noreferrer">
                <span class="tool-link-icon">🏝️</span>
                <span data-i18n="toolMerge">合併島嶼矩陣計算器</span>
            </a>

            <a href="https://der46.github.io/snow-calc/" target="_blank" rel="noopener noreferrer">
                <span class="tool-link-icon">❄️</span>
                <span data-i18n="toolSnow">雪崩派對進度計算機</span>
            </a>

            <a href="https://der46.github.io/energy-group-helper/" target="_blank" rel="noopener noreferrer">
                <span class="tool-link-icon">🔄</span>
                <span data-i18n="toolEnergyGroup">活動道具換算</span>
            </a>

            <a href="https://der46.github.io/coin_fetch/" target="_blank" rel="noopener noreferrer">
                <span class="tool-link-icon">🔋</span>
                <span data-i18n="toolReward">CM每日獎勵連結</span>
            </a>

            <a href="https://der46.github.io/cm_village_cost/" target="_blank" rel="noopener noreferrer">
                <span class="tool-link-icon">💰</span>
                <span data-i18n="toolVillageCost">建村金額</span>
            </a>
        </nav>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <main class="app">
        <section class="hero">
            <div class="hero-actions">
                <select id="languageSelect" class="language-select" aria-label="Language">
                    <option value="zh-Hant">中文</option>
                    <option value="en">English</option>
                    <option value="vi">Tiếng Việt</option>
                </select>

                <button id="desktopToolBtn" class="top-tool-btn" type="button" data-i18n="toolLinksButton">
                    ☰ 工具連結
                </button>
            </div>

            <h1 data-i18n="appTitle">活動時刻表</h1>
        </section>

        <section class="weekday-card">
            <div class="weekday-header">
                <div>
                    <h2 class="weekday-title" data-i18n="selectWeekday">選擇星期</h2>
                    <div id="weekdaySubtitle" class="weekday-subtitle" data-i18n="defaultToday">預設顯示今天的活動</div>
                </div>
            </div>

            <div id="weekdayButtons" class="weekday-buttons">
                <button class="weekday-btn" type="button" data-command="/1">
                    <span class="weekday-main" data-i18n="monShort">週一</span>
                    <span class="weekday-small" data-i18n="mon">星期一</span>
                </button>

                <button class="weekday-btn" type="button" data-command="/2">
                    <span class="weekday-main" data-i18n="tueShort">週二</span>
                    <span class="weekday-small" data-i18n="tue">星期二</span>
                </button>

            const dictionary = currentLang === "en" ? enDict : viDict;
            let result = String(text || "");

            Object.entries(dictionary)
                .sort((a, b) => b[0].length - a[0].length)
                .forEach(([from, to]) => {
                    result = result.replaceAll(from, to);
                });

            return cleanupTranslatedScheduleText(result);
        }

        function getLocalizedValue(value) {
            if (value && typeof value === "object" && !Array.isArray(value)) {
                const raw = value[currentLang] || value["zh-Hant"] || value.en || value.vi || "";
                return currentLang === "zh-Hant" ? raw : cleanupTranslatedScheduleText(raw);
            }

            return translateScheduleText(value || "");
        }

        function getItemTitle(item) {
            return getLocalizedValue(item.title);
        }

        function getItemDescription(item) {
            return getLocalizedValue(item.description);
        }

        function applyI18n() {
            document.documentElement.lang = currentLang;
            document.title = t("pageTitle");

            document.querySelectorAll("[data-i18n]").forEach(element => {
                const key = element.dataset.i18n;
                element.textContent = t(key);
            });

            if (languageSelect) {
                languageSelect.value = currentLang;
            }

            if (rawToggleBtn && !detailDescription.classList.contains("show")) {
                rawToggleBtn.textContent = t("showRaw");
            }

            updateWeekdayButtons(selectedCommand || getWeekdayCommandByDate(new Date()));

            if (currentSelected) {
                selectItem(currentSelected, false);
            }
        }

        async function loadData() {
            try {
                detailEmpty.innerHTML = `
                <div class="loading-box">
                    ${escapeHtml(t("loadingData"))}<br />
                    ${escapeHtml(t("readingData"))} <strong>data.json</strong>
                </div>
            `;

                const response = await fetch("data.json", { cache: "no-store" });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const jsonData = await response.json();

                if (!Array.isArray(jsonData)) {
                    throw new Error(t("jsonFormatError"));
                }

                DATA = jsonData.map(item => ({
                    command: item.command || "",
                    title: item.title || "",
                    type: item.type || "schedule",
                    description: item.description || ""
                }));

                dataLoaded = true;

                const todayCommand = getWeekdayCommandByDate(new Date());

                selectWeekdayCommand(todayCommand, {
                    scrollToDetail: false,
                    toastMessage: ""
                });

            } catch (error) {
                dataLoaded = false;
                DATA = [];

                detailEmpty.style.display = "block";
                detailBox.classList.remove("show");

                detailEmpty.innerHTML = `
                <div class="error-box">
                    <strong>${escapeHtml(t("dataLoadFailed"))}</strong><br />
                    ${escapeHtml(t("dataLoadHint"))}<br />
                    <span>${escapeHtml(error.message)}</span>
                </div>
            `;
            }
        }

        function updateWeekdayButtons(command) {
            selectedCommand = command;

            const todayCommand = getWeekdayCommandByDate(new Date());

            document.querySelectorAll(".weekday-btn").forEach(button => {
                const isActive = button.dataset.command === command;
                const isToday = button.dataset.command === todayCommand;

                button.classList.toggle("active", isActive);
                button.classList.toggle("today", isToday);
            });

            if (weekdaySubtitle && command) {
                const label = getCommandLabel(command);
                const todayLabel = getCommandLabel(todayCommand);

                weekdaySubtitle.textContent = label === todayLabel
                    ? `${t("currentlyShowing")}：${label}${t("activity")}（${t("today")}）`
                    : `${t("currentlyShowing")}：${label}${t("activity")}｜${t("todayIs")}${todayLabel}`;
            }
        }

        function selectWeekdayCommand(command, options = {}) {
            if (!dataLoaded) {
                showToast(t("dataNotLoaded"));
                return;
            }

            const item = findItemByCommand(command);

            if (!item) {
                showToast(`${t("notFound")} ${command}`);
                return;
            }

            updateWeekdayButtons(command);
            selectItem(item, options.scrollToDetail ?? false);

            if (options.toastMessage) {
                showToast(options.toastMessage);
            }
        }

        const parseDuration = text => {
            const matches = [...String(text).matchAll(/[（(]([^）)]+)[）)]/g)];

            for (const match of matches) {
                const inside = match[1].trim();

                const isDuration =
                    /^\d+\s*(?:Min|mins|min|分鐘|分|H|Hr|hrs|小時)$/i.test(inside) ||
                    /^登入後?\s*\d+\s*(?:Min|mins|min|分鐘|分|H|Hr|hrs|小時)$/i.test(inside) ||
                    /^(After Login|Sau khi đăng nhập)\s*\d+\s*(?:Min|mins|min|H|Hr|hrs)$/i.test(inside);

                if (isDuration) {
                    return {
                        label: inside,
                        raw: match[0]
                    };
                }
            }

            return {
                label: "",
                raw: ""
            };
        };

        function splitEventText(text, durationRaw) {
            let name = String(text || "").trim();
            let note = "";

            if (durationRaw) {
                const index = name.indexOf(durationRaw);

                if (index >= 0) {
                    const before = name.slice(0, index).trim();
                    const after = name.slice(index + durationRaw.length).trim();

                    name = before || name;
                    note = after;
                }
            }

            const noteMatch = name.match(/[（(]([^）)]+)[）)]/);

            if (noteMatch) {
                const before = name.slice(0, noteMatch.index).trim();
                const inside = noteMatch[1].trim();
                const after = name.slice(noteMatch.index + noteMatch[0].length).trim();

                if (before) {
                    name = before;
                    note = [inside, after].filter(Boolean).join(" ");
                }
            }

            name = name
                .replace(/（\s*）/g, "")
                .replace(/\(\s*\)/g, "")
                .replace(/\s+/g, " ")
                .trim();

            note = note
                .replace(/\s+/g, " ")
                .trim();

            return {
                name,
                note
            };
        }

        const getEventCategory = text => {
            const value = String(text || "");

            if (/建村|完村|村落爆增|村落|Village Build|Village Completion|Village Boom|Xây làng|hoàn thành làng|Bùng nổ làng|Làng/i.test(value)) {
                return "village";
            }

            if (/金槌|金鎚|金錘|團隊金|槌|鎚|錘|🔨|Hammer|Team Hammer|Búa|Đội Búa/i.test(value)) {
                return "hammer";
            }

            if (/卡牌|金卡|藍卡|完冊|流星|Card Boost|Gold Card|Blue Card|Set Blast|Cards|Thẻ|Tăng thẻ|Sao băng|thẻ vàng|thẻ xanh/i.test(value)) {
                return "card";
            }

            if (/金幣狂歡|Coin Craze|Sự kiện xu|150%/i.test(value)) {
                return "coin";
            }

            if (/鬼牌|競賽|競技|任務|維京|攀登|攀爬|保險箱|雷幣|財寶|寶藏|荒野|銀河|三霸|小徑|代幣|衝刺|首領|寵物|賽季|通行證|獎賞|探索|活動|更新|Event|Mission|Competition|Joker|Viking|Galaxy|Treasure|Reward Road|Build Rush|Sự kiện|Nhiệm vụ|Bộ ba|Kho báu|Con đường|Cơn sốt/i.test(value)) {
                return "mission";
            }

            if (/金幣|coin|Coins|Xu/i.test(value)) {
                return "coin";
            }

            return "default";
        };

        const getCategoryLabel = category => ({
            village: t("categoryVillage"),
            coin: t("categoryCoin"),
            hammer: t("categoryHammer"),
            card: t("categoryCard"),
            mission: t("categoryMission"),
            default: t("categoryDefault")
        }[category] || t("categoryDefault"));

        function parseScheduleDescription(description) {
            const lines = String(description || "")
                .split(/\r?\n/)
                .map(line => line.trim())
                .filter(Boolean);

            const headerLines = [];
            const events = [];

            lines.forEach((line, index) => {
                const match = line.match(/^(\d{1,2}:\d{2})\s+(.+)$/);

                if (!match) {
                    headerLines.push(line);
                    return;
                }

                const time = normalizeTime(match[1]);
                const text = match[2].trim();
                const durationInfo = parseDuration(text);
                const cleanInfo = splitEventText(text, durationInfo.raw);

                events.push({
                    id: index,
                    time,
                    hour: Number(time.split(":")[0]),
                    name: cleanInfo.name,
                    note: cleanInfo.note,
                    durationText: durationInfo.label,
                    original: text,
                    category: getEventCategory(text)
                });
            });

            events.sort((a, b) => {
                return a.hour !== b.hour ? a.hour - b.hour : a.time.localeCompare(b.time);
            });

            return {
                header: headerLines.join(" "),
                events
            };
        }

        function renderScheduleView(item) {
            const parsed = parseScheduleDescription(getItemDescription(item));

            if (!parsed.events.length) {
                scheduleView.innerHTML = `
                <div class="no-result">
                    ${escapeHtml(t("noSchedule"))}
                </div>
            `;
                return;
            }

            const grouped = new Map(Array.from({ length: 24 }, (_, hour) => [hour, []]));

            parsed.events.forEach(event => {
                grouped.get(event.hour).push(event);
            });

            const firstEvent = parsed.events[0];
            const lastEvent = parsed.events[parsed.events.length - 1];

            const todayCommand = getWeekdayCommandByDate(new Date());
            const isSelectedToday = selectedCommand === todayCommand;
            const currentHour = new Date().getHours();

            const headerTitle = parsed.header || getItemTitle(item) || t("dailySchedule");
            const updateText = getUpdateText(headerTitle);
            const cleanHeaderTitle = removeUpdateText(headerTitle) || getItemTitle(item) || t("dailySchedule");

            const rows = Array.from({ length: 24 }, (_, hour) => {
                const events = grouped.get(hour) || [];
                const isCurrent = isSelectedToday && hour === currentHour;

                const eventRows = events.length ? events.map(event => `
                <div class="event-cell-row">
                    <span class="event-start">${escapeHtml(event.time)}~</span>
                    <span class="event-badge ${escapeHtml(event.category)}">${escapeHtml(getCategoryLabel(event.category))}</span>
                    <div class="event-title-wrap">
                        <div class="event-name">${escapeHtml(event.name)}</div>
                        ${event.note ? `<div class="event-note">${escapeHtml(event.note)}</div>` : ""}
                    </div>
                </div>
            `).join("") : `<div class="empty-event-row"></div>`;

                const durationRows = events.length ? events.map(event => `
                <div class="duration-cell-row">${event.durationText ? escapeHtml(event.durationText) : ""}</div>
            `).join("") : `<div class="empty-duration-row"></div>`;

                return `
                <div class="schedule-hour-row ${isCurrent ? "current-hour" : ""}">
                    <div class="hour-time-cell">${hour}:00~</div>
                    <div class="hour-events-cell">${eventRows}</div>
                    <div class="hour-duration-cell">${durationRows}</div>
                </div>
            `;
            }).join("");

            scheduleView.innerHTML = `
            <div class="schedule-summary">
                <div class="summary-card">
                    <div class="summary-label">${escapeHtml(t("eventCount"))}</div>
                    <div class="summary-value">${parsed.events.length}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">${escapeHtml(t("firstEvent"))}</div>
                    <div class="summary-value">${escapeHtml(firstEvent.time)}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">${escapeHtml(t("lastEvent"))}</div>
                    <div class="summary-value">${escapeHtml(lastEvent.time)}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">${escapeHtml(t("currentPeriod"))}</div>
                    <div class="summary-value">${isSelectedToday ? `${currentHour}:00` : "-"}</div>
                </div>
            </div>

            <div class="schedule-shell" id="scheduleShell">
                <div class="schedule-fit" id="scheduleFit">
                    <div class="schedule-board" id="scheduleBoard">
                        <div class="schedule-board-head">
                            <div class="schedule-head-cell">${escapeHtml(t("time"))}</div>
                            <div class="schedule-head-cell">
                                <div>
                                    <div>${escapeHtml(cleanHeaderTitle)}</div>
                                    ${updateText ? `<div class="schedule-update">${escapeHtml(updateText)}</div>` : ""}
                                </div>
                            </div>
                            <div class="schedule-head-cell">${escapeHtml(t("duration"))}</div>
                        </div>

                        ${rows}
                    </div>
                </div>
            </div>
        `;

            requestAnimationFrame(() => {
                fitScheduleBoard();

                const currentRow = scheduleView.querySelector(".schedule-hour-row.current-hour");

                if (currentRow && window.innerWidth > 820) {
                    currentRow.scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });
                }
            });
        }

        function fitScheduleBoard() {
            const fit = $("scheduleFit");
            const board = $("scheduleBoard");

            if (!fit || !board) return;

            board.style.transform = "";
            fit.style.height = "";

            if (window.innerWidth > 820) return;

            const availableWidth = fit.clientWidth;
            const boardWidth = board.offsetWidth;

            if (!availableWidth || !boardWidth) return;

            const scale = Math.min(availableWidth / boardWidth, 1);

            board.style.transform = `scale(${scale})`;
            fit.style.height = `${board.offsetHeight * scale}px`;
        }

        function renderVisibleDescription(item) {
            const description = String(getItemDescription(item) || "").trim();

            if (!description) {
                detailDescription.innerHTML = "";
                detailDescription.style.display = "none";
                detailDescription.classList.remove("show");
                return;
            }

            detailDescription.innerHTML = linkifyText(description).replace(/\n/g, "<br>");
            detailDescription.style.display = "block";
            detailDescription.classList.add("show");
        }

        function hideRawDescription() {
            detailDescription.innerHTML = "";
            detailDescription.style.display = "none";
            detailDescription.classList.remove("show");

            if (rawToggleBtn) {
                rawToggleBtn.textContent = t("showRaw");
            }
        }

        function selectItem(item, scrollToDetail = false) {
            currentSelected = item;

            detailEmpty.style.display = "none";
            detailBox.classList.add("show");

            detailCommand.textContent = item.command || "";
            detailTitle.textContent = getItemTitle(item) || t("dailySchedule");

            const todayCommand = getWeekdayCommandByDate(new Date());
            const selectedLabel = getCommandLabel(selectedCommand);
            const todayLabel = getCommandLabel(todayCommand);

            todayBadge.textContent = selectedCommand === todayCommand
                ? `${t("today")}｜${getDisplayDate(new Date())} ${getWeekdayNameByDate(new Date())}`
                : `${t("currentSelection")}：${selectedLabel}｜${t("todayIs")}${todayLabel}`;

            hideRawDescription();
            renderScheduleView(item);

            if (scrollToDetail && detailSection) {
                detailSection.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            }
        }

        function showToast(message) {
            if (!toast || !message) return;

            toast.textContent = message;
            toast.classList.add("show");

            window.clearTimeout(showToast.timer);

            showToast.timer = window.setTimeout(() => {
                toast.classList.remove("show");
            }, 1800);
        }

        function openSidebar() {
            mobileSidebar.classList.add("show");
            sidebarOverlay.classList.add("show");
            document.body.classList.add("sidebar-open");
        }

        function closeSidebar() {
            mobileSidebar.classList.remove("show");
            sidebarOverlay.classList.remove("show");
            document.body.classList.remove("sidebar-open");
        }

        function bindEvents() {
            if (languageSelect) {
                languageSelect.addEventListener("change", () => {
                    currentLang = languageSelect.value;
                    localStorage.setItem("coin999_lang", currentLang);
                    applyI18n();
                });
            }

            if (weekdayButtons) {
                weekdayButtons.querySelectorAll(".weekday-btn").forEach(button => {
                    button.addEventListener("click", () => {
                        const command = button.dataset.command;

                        selectWeekdayCommand(command, {
                            scrollToDetail: false,
                            toastMessage: `${t("switchedTo")}：${getCommandLabel(command)}${t("activity")}`
                        });
                    });
                });
            }

            if (rawToggleBtn) {
                rawToggleBtn.addEventListener("click", () => {
                    if (!currentSelected) return;

                    const isVisible = detailDescription.classList.contains("show");

                    if (isVisible) {
                        hideRawDescription();
                    } else {
                        renderVisibleDescription(currentSelected);
                        rawToggleBtn.textContent = t("hideRaw");
                    }
                });
            }

            if (mobileMenuBtn) {
                mobileMenuBtn.addEventListener("click", openSidebar);
            }

            if (desktopToolBtn) {
                desktopToolBtn.addEventListener("click", openSidebar);
            }

            if (mobileSidebarClose) {
                mobileSidebarClose.addEventListener("click", closeSidebar);
            }

            if (sidebarOverlay) {
                sidebarOverlay.addEventListener("click", closeSidebar);
            }

            document.querySelectorAll(".mobile-tool-nav a").forEach(link => {
                link.addEventListener("click", closeSidebar);
            });

            window.addEventListener("resize", fitScheduleBoard);

            document.addEventListener("keydown", event => {
                if (event.key === "Escape") {
                    closeSidebar();
                }
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (copyrightYear) {
                copyrightYear.textContent = new Date().getFullYear();
            }

            if (!I18N[currentLang]) {
                currentLang = "zh-Hant";
            }

            if (languageSelect) {
                languageSelect.value = currentLang;
            }

            applyI18n();
            bindEvents();
            loadData();
        });
    </script>
